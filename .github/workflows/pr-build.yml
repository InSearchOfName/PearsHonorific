name: Sample PR Builder for PearHonorific

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    runs-on: windows-2022

    env:
      Solution_Name: PearHonorific

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

    - name: Install SonarScanner
      run: dotnet tool install --global dotnet-sonarscanner

    - name: Begin SonarCloud analysis
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: >
        dotnet sonarscanner begin
        /k:"InSearchOfName_PearsHonorific"
        /o:"insearchofname"
        /d:sonar.token="$env:SONAR_TOKEN"
        /d:sonar.host.url="https://sonarcloud.io"
        /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"
        /d:sonar.coverage.exclusions=".github/**,PearHonorific/Windows/**,PearHonorific/Pear/PearApiClient.cs,PearHonorific/Plugin.cs,PearHonorific/Core/HonorificIpc.cs,PearHonorific/Configuration.cs"

    - name: Build with dotnet
      run: dotnet build --configuration Release

    - name: Test with coverage
      run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

    - name: End SonarCloud analysis
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

    - name: Store artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PearHonorific
        path: .\PearHonorific\bin\x64\Release\PearHonorific\*
        if-no-files-found: error
        retention-days: 1

