name: Release PearHonorific

# Publish a GitHub release (tag like v1.0.0). This builds the plugin and attaches latest.zip and repo.json to it.
# Users add this custom repository URL in Dalamud:
#   https://github.com/<owner>/<repo>/releases/latest/download/repo.json
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

    - name: Get version from tag
      id: version
      run: |
        $version = "${{ github.event.release.tag_name }}".TrimStart('v')
        "version=$version" >> $env:GITHUB_OUTPUT

    - name: Build
      run: dotnet build PearHonorific/PearHonorific.csproj --configuration Release -p:Version=${{ steps.version.outputs.version }}

    - name: Count downloads
      id: downloads
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $count = ./.github/scripts/get-download-count.ps1 -Repository "${{ github.repository }}"
        "count=$count" >> $env:GITHUB_OUTPUT

    - name: Generate repo.json
      run: >
        ./.github/scripts/make-repo-json.ps1
        -DownloadCount ${{ steps.downloads.outputs.count }}
        -ManifestPath PearHonorific/bin/Release/PearHonorific/PearHonorific.json
        -Repository "${{ github.repository }}"
        -Tag "${{ github.event.release.tag_name }}"
        -OutPath repo.json

    - name: Upload to release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "${{ github.event.release.tag_name }}" PearHonorific/bin/Release/PearHonorific/latest.zip repo.json --clobber
